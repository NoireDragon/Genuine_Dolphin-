<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080909">
  <meta name="description" content="Partenza Ludovico. Un percorso scout raccontato in un'esperienza narrativa interattiva.">
  <title>Partenza Ludovico</title>
  <link rel="preload" as="image" href="assets/img/Jumpscare_bg.gif">
  <link rel="preload" as="image" href="assets/img/Jumpscare.gif" type="image/gif">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/analog.css">
  <link rel="stylesheet" href="css/interference.css">
</head>
<body class="booting innocent-mode">
  <div class="tv-frame" id="tvFrame">
    <div class="screen-glass" id="screenGlass">
      <div class="screen-backdrop" id="screenBackdrop" aria-hidden="true"></div>
      <svg class="filter-bank" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>
          <filter id="jumpDistort" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.045" numOctaves="2" seed="13" result="warp">
              <animate attributeName="baseFrequency" values="0.012 0.045;0.035 0.11;0.008 0.025;0.028 0.075;0.012 0.045" dur="0.42s" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="warp" scale="44" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
      </svg>
      <div class="crt-layer scanlines" aria-hidden="true"></div>
      <div class="crt-layer film-grain" aria-hidden="true"></div>
      <div class="crt-layer vignette" aria-hidden="true"></div>
      <div class="tracking-band" aria-hidden="true"></div>

      <section class="boot-screen" id="bootScreen" aria-labelledby="bootTitle">
        <div class="boot-center">
          <h1 id="bootTitle">PARTENZA LUDOVICO</h1>
          <button class="action-button action-primary" id="playTape" type="button"><span class="play-icon">▶</span> Riproduci Nastro</button>
        </div>
      </section>

      <div id="app" class="app-shell" hidden>
        <main id="scene" class="scene" aria-live="polite" aria-atomic="false"></main>
      </div>

      <div class="screen-flash" id="screenFlash" aria-hidden="true"></div>
      <div class="anomaly-toast" id="anomalyToast" role="status" aria-live="assertive"></div>
      <div class="shutdown-overlay" id="shutdownOverlay" aria-hidden="true"><div class="shutdown-line"></div></div>

    </div>
  </div>

  <!-- Overlay separato dal televisore: il mostro si muove davanti allo schermo, nello spazio della pagina. -->
  <div class="jumpscare-overlay" id="jumpscareOverlay" aria-hidden="true">
    <img id="jumpscareBackground" class="jumpscare-background" src="assets/img/Jumpscare_bg.gif" alt="">
    <img class="jumpscare-echo jumpscare-echo--far" src="assets/img/Jumpscare.gif" alt="" aria-hidden="true">
    <img class="jumpscare-echo jumpscare-echo--near" src="assets/img/Jumpscare.gif" alt="" aria-hidden="true">
    <img id="jumpscareSprite" class="jumpscare-sprite" src="assets/img/Jumpscare.gif" alt="">
  </div>

  <script src="data/story.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/credits.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
